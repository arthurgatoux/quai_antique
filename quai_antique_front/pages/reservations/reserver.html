<div class="hero-scene text-center text-white">
    <div class="hero-scene-content">
        <h1>Ma réservation</h1>
    </div>
</div>

<div class="container">
    <form id="reservationForm" novalidate>
        <div class="mb-3">
            <label for="NomInput" class="form-label">Nom</label>
            <input disabled type="text" class="form-control" id="NomInput" placeholder="Votre nom" name="Nom">
        </div>
        <div class="mb-3">
            <label for="PrenomInput" class="form-label">Prénom</label>
            <input disabled type="text" class="form-control" id="PrenomInput" placeholder="Votre prénom"
                name="Prenom">
        </div>
        <div class="mb-3">
            <label for="AllergieInput" class="form-label">Allergies</label>
            <input type="text" class="form-control" id="AllergieInput" maxlength="255"
                placeholder="Vos allergies (fruits de mer, arachides..)" name="Allergies">
        </div>
        <div class="mb-3">
            <label for="NbConvivesInput" class="form-label">Nombre de convives</label>
            <input type="number" class="form-control" id="NbConvivesInput" min="1" max="50"
                placeholder="Combien serez-vous ?" name="NbConvives">
        </div>
        <div class="mb-3">
            <label for="DateInput" class="form-label">Date</label>
            <input type="date" class="form-control" id="DateInput" name="Date">
        </div>
        <div class="mb-3">
            <div class="form-check">
                <input class="form-check-input" type="radio" name="serviceChoisi" id="midiRadio">
                <label class="form-check-label" for="midiRadio">
                    Midi
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="serviceChoisi" id="soirRadio" checked>
                <label class="form-check-label" for="soirRadio">
                    Soir
                </label>
            </div>
        </div>
        <div class="mb-3">
            <label for="selectHour" class="form-label">Heure</label>
            <select class="form-select" id="selectHour" name="Heure"></select>
        </div>
        <p class="text-center text-danger d-none" id="reservation-error" role="alert"></p>
        <div class="text-center">
            <button type="submit" class="btn btn-primary" id="btn-reserver">Réserver</button>
            <button type="button" class="btn btn-danger d-none" id="btn-annuler" data-bs-toggle="modal"
                data-bs-target="#CancelResaModal">Annuler la réservation</button>
        </div>
    </form>
</div>

<!-- Modal confirmation d'annulation -->
<div class="modal fade" id="CancelResaModal" tabindex="-1" aria-labelledby="CancelResaModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title fs-5" id="CancelResaModalLabel">Annuler cette réservation ?</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p id="cancel-resa-summary"></p>
                <p class="text-danger d-none" id="cancel-resa-error" role="alert"></p>
                <div class="text-center">
                    <button type="button" class="btn btn-danger" id="btn-confirm-cancel">Oui, annuler</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Non, la garder</button>
                </div>
            </div>
        </div>
    </div>
</div>
