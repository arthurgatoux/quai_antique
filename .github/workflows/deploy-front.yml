name: Deploy front

on:
  push:
    branches: [main]
    paths:
      - "quai_antique_front/**"
      - ".github/workflows/deploy-front.yml"
  workflow_dispatch:

jobs:
  web-deploy:
    name: Deploy front sur Alwaysdata
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm dependencies
        working-directory: quai_antique_front
        run: npm ci

      - name: Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp-quaiantiquerestaurant17.alwaysdata.net
          protocol: ftp
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./quai_antique_front/
          server-dir: /www/
          exclude: |
            **/.git*
            **/.git*/**
            Readme.md
            **/node_modules/bootstrap-icons/icons/**
            **/node_modules/bootstrap/scss/**
